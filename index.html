<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4efe2;--card:#fbf8ef;--tx:#2b2a28;--mu:#7a7468;--ac:#2c4a7a;--ac2:#e3e6ea;--ln:#d9d1bd;--wa:#a8372c;--gd:#b8862b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1c18;--card:#272420;--tx:#ece6d6;--mu:#a39c8c;--ac:#8fb0e0;--ac2:#2f3a4d;--ln:#3a362e;--wa:#e07a6c;--gd:#d9ad55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1c18;--card:#272420;--tx:#ece6d6;--mu:#a39c8c;--ac:#8fb0e0;--ac2:#2f3a4d;--ln:#3a362e;--wa:#e07a6c;--gd:#d9ad55;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font:700 20px "Noto Serif KR",Georgia,serif;margin:2px 0 10px}h2{font-size:15px;margin:0 0 8px}
.top{font-weight:700;font-size:16px;margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.card.sm{padding:10px 14px}.q{font-size:15px;line-height:1.7;border-left:4px solid var(--ac);border-radius:4px 12px 12px 4px;cursor:pointer}
.mu{color:var(--mu);font-size:12px;margin:3px 0}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin-top:6px}.bar.thin{height:4px}.bar>i{display:block;height:100%;background:var(--ac)}
.dots{display:flex;gap:8px;margin:8px 0 2px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gd);box-sizing:border-box}.dots i.on{background:var(--gd)}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row,.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}.row>*{flex:1}
.r2,.r3{display:grid;gap:8px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--bg);cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}button.d{background:none;color:var(--wa);padding:4px 8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);margin:0 6px 6px 0}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}.chip.al.on{background:var(--wa);border-color:var(--wa)}.chip.s{padding:6px 10px;margin:0;white-space:nowrap}
.dfm label{margin:2px 0}.dfm input,.dfm select,.dfm textarea{padding:7px}
.ml{display:flex;gap:6px;align-items:center;margin:4px 0}.ml span{width:32px;font-size:13px}.mk{width:38px;padding:7px 0;border:1px solid var(--ln);background:var(--bg)}

.o{color:var(--ac)}.h{color:var(--gd)}.x{color:var(--wa)}

.cc{padding:3px 1px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:0}.cc.td{border:2px solid var(--ac)}.cc b{font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:6px 0}nav button.on{color:var(--ac);font-weight:700}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.pk{display:block;width:100%;text-align:left;background:none;color:var(--tx);border-bottom:1px solid var(--ln);border-radius:0}
a{color:var(--ac)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mc{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card p{margin:4px 0}.sb{padding:6px 10px;font-size:12px}.top{font-size:15px;margin:2px 0 8px}.top .mu{font-weight:400}.q{cursor:default}.card.q{font-size:13px;line-height:1.5}
.t{display:flex;gap:2px;align-items:baseline}.t em{font-style:normal;font-size:9px;color:var(--mu)}
.cc{min-height:34px;padding:2px 1px;justify-content:center;line-height:1.15;border-radius:5px}.cc small{font-size:10px;white-space:nowrap;color:var(--tx)}
.ws{display:flex;gap:4px;overflow-x:auto;margin-top:6px}.wc{flex:0 0 46px;text-align:center;font-size:10px;line-height:1.35;border:1px solid var(--ln);border-radius:6px;padding:2px 0;display:flex;flex-direction:column}.wc.cur{border:2px solid var(--ac)}.wc.lb{border:0;flex:0 0 26px;color:var(--mu)}
.r2>select{padding:6px 8px}
body{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,color-mix(in srgb,var(--ln) 45%,transparent) 27px,color-mix(in srgb,var(--ln) 45%,transparent) 28px);background-attachment:local}
h1,h2,.top b,.card.q{font-family:"Gowun Batang","Noto Serif KR",Georgia,serif}h1{font-size:22px}.card.q{font-size:14px}
.card{border-radius:6px;box-shadow:0 1px 0 var(--ln)}button{border-radius:5px}
input,select{background:transparent;border-width:0 0 1px;border-radius:0}textarea{background:transparent;border-radius:4px}
.o,.h,.x{font-weight:700}nav button.on{box-shadow:inset 0 -2px 0 var(--ac)}
</style></head><body>
<div id="app"></div><div id="modal"></div><nav id="nav"></nav>
<script>
const K='dietdiary_v1';
let S={seasons:[],days:{},meas:[],links:[],routines:['팔','배','하체'],pick:'',quotes:[{t:"오늘의 10분이 한 달 뒤의 나를 만듭니다.",s:3},{t:"완벽하지 않아도 괜찮습니다. 멈추지만 않으면 됩니다.",s:2},{t:"체중보다 중요한 것은 오늘 지킨 습관입니다.",s:2},{t:"하루 쉬었다면 내일 다시 시작하면 그만입니다.",s:2},{t:"작은 성공이 쌓여 큰 변화가 됩니다.",s:3},{t:"비교 대상은 남이 아니라 어제의 나입니다.",s:1},{t:"운동은 하기 싫은 마음을 이기는 연습입니다.",s:1}]};
function mig(){S.quotes=(S.quotes||[]).map(q=>typeof q==='string'?{t:q,s:2}:q);if(!S.routines)S.routines=['팔','배','하체'];
for(const k in S.days){const d=S.days[k];if((d.arm||d.abs||d.leg)&&!d.rt){d.rt=[];d.arm&&d.rt.push('팔');d.abs&&d.rt.push('배');d.leg&&d.rt.push('하체');d.an=true}}}
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
mig();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ymd(new Date()),D=s=>new Date(s+'T00:00:00'),diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const addd=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>addd(s,-((D(s).getDay()+6)%7));
const WD=['월','화','수','목','금','토','일'],dw=s=>WD[(D(s).getDay()+6)%7],f2=s=>s.slice(2).replace(/-/g,'.');
const fmt=n=>(n>0?'+':'')+(+n.toFixed(2));
const act=()=>S.seasons.find(x=>!x.end);
const car=d=>!!d&&!!(d.car||+d.run>0||+d.km>0),ana=d=>!!d&&!!(d.an||(d.rt&&d.rt.length));
const sess=d=>(car(d)?1:0)+(ana(d)?1:0);
const wkCount=w=>{let n=0;for(let i=0;i<7;i++)n+=sess(S.days[addd(w,i)]);return n};
const wn=s=>Math.max(1,Math.floor(diff(today(),s.start)/7)+1),wr=(s,n)=>[addd(s.start,7*(n-1)),addd(s.start,7*n-1)];
const nw=s=>Math.max(1,Math.ceil((diff(s.end||(s.goalDate>today()?s.goalDate:today()),s.start)+1)/7));
const sc=(s,n)=>Math.min(100,Math.round(wkCount(wr(s,n)[0])/(s.wk||5)*100));
const MS={o:'○','△':'△',x:'✕'},MC={o:'o','△':'h',x:'x'},sp=v=>v?`<span class="${MC[v]}">${MS[v]}</span>`:'·';
const mk=(d,i)=>(d['m'+i]||'').trim()?(d['r'+i]||'o'):'x';
function dmark(d){if(!d)return'';const f=[0,1,2,3].filter(i=>(d['m'+i]||'').trim());if(!f.length)return'';const a=f.reduce((s,i)=>s+{o:1,'△':.5,x:0}[mk(d,i)],0)/f.length;return a>=.75?'o':a>=.4?'△':'x'}
function emark(k,d,s){const n=sess(d);return n>=2?'o':n==1?'△':((s&&k>=s.start&&k<=today())||d)?'x':''}
const M=[['wa','허리'],['be','복부'],['hi','엉덩이'],['th','허벅지'],['ar','팔']];
const bar=(p,c)=>`<div class="bar ${c||''}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const dots=(n,t)=>`<div class="dots">${Array.from({length:t},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
let V='home',cd=today(),MO=null,CY=today().slice(0,7),CW=0,lf='전체',CS='',CE='';
const dy=()=>S.days[cd]||(S.days[cd]={});
function st(s){const e=s.end||today();let n=0,dys=0;for(const k in S.days){if(k>=s.start&&k<=e){const d=S.days[k],c=sess(d);n+=c;if(c||d.m0||d.m1||d.m2||d.memo)dys++}}
const ms=S.meas.filter(m=>m.w!=null&&m.date>=s.start&&m.date<=e),cur=ms.length?ms[ms.length-1].w:s.startW;
const pct=s.goalW!=s.startW?Math.max(0,Math.min(100,(cur-s.startW)/(s.goalW-s.startW)*100)):0;
return{n,dys,cur,pct,wks:Math.max(1,(diff(e,s.start)+1)/7)}}
function months(s){let c=s?s.start.slice(0,7):today().slice(0,7);const e=(s?(s.goalDate>today()?s.goalDate:today()):today()).slice(0,7),o=[];while(c<=e&&o.length<60){o.push(c);const[y,m]=c.split('-').map(Number);c=m==12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`}return o}
function sel(s){const n=s?nw(s):0;return`<div class="r2"><select data-s="ym">${months(s).map(m=>`<option ${m===CY?'selected':''}>${m}</option>`).join('')}</select><select data-s="cw"><option value="0">누적</option>${Array.from({length:n},(_,i)=>`<option value="${i+1}" ${CW==i+1?'selected':''}>${i+1}주차</option>`).join('')}</select></div>`}
function calhtml(e){const s=act();let ds,sum='';
if(CW>0&&s){const a=wr(s,CW)[0];ds=Array.from({length:7},(_,i)=>addd(a,i));const n=wkCount(a),wk=s.wk||5,p=Math.min(100,Math.round(n/wk*100));sum=`<p><b>${CW}주차 ${p}점</b> (${n} / ${wk}회)${p>=100?' 🎉 목표 달성':''}</p>`}
else{const[y,m]=CY.split('-').map(Number),dim=new Date(y,m,0).getDate();ds=Array(((D(CY+'-01').getDay()+6)%7)).fill(null).concat(Array.from({length:dim},(_,i)=>CY+'-'+String(i+1).padStart(2,'0')));let n=0;ds.forEach(k=>{if(k)n+=sess(S.days[k])});sum=`<p><b>${CY}</b> 운동 ${n}회${s?` · 시즌 누적 ${st(s).n}회`:''}</p>`}
const wdl={};let p=null;S.meas.forEach(m=>{if(m.w!=null){wdl[m.date]=p==null?String(m.w):fmt(m.w-p);p=m.w}});
const c=ds.map(k=>{if(!k)return'<i></i>';const d=S.days[k];return`<button class="cc ${k===today()?'td':''}" data-a="day" data-d="${k}"><span class="t"><b>${+k.slice(8)}</b>${!e&&wdl[k]?`<em>${wdl[k]}</em>`:''}</span><small>${e?`유${car(d)?'●':'○'} 무${ana(d)?'●':'○'}`:`식${sp(dmark(d))} 운${sp(emark(k,d,s))}`}</small></button>`}).join('');
return`${sum}<div class="cal wl">${WD.map(w=>`<small>${w}</small>`).join('')}</div><div class="cal">${c}</div><p class="mu" style="margin:4px 0 0">${e?'● 수행 ○ 미수행':'체중 변화(kg) · 식 · 운 (○ 좋음 △ 보통 ✕ 없음)'} · 날짜를 누르면 수정</p>`}
const nwk=s=>Math.max(1,Math.ceil((diff(s.goalDate,s.start)+1)/7));
const tw=(s,n)=>s.wt&&s.wt[n]!=null&&s.wt[n]!==''?+s.wt[n]:+(s.startW+(s.goalW-s.startW)*n/nwk(s)).toFixed(1);
function wkAch(s,n){const[a,e]=wr(s,n);if(a>today())return null;const ms=S.meas.filter(m=>m.w!=null&&m.date>=s.start&&m.date<=e);if(!ms.length)return null;const t=tw(s,n);return s.startW!=t?Math.max(0,Math.min(100,(ms[ms.length-1].w-s.startW)/(t-s.startW)*100)):0}
function home(){const s=act(),T=today(),n=s?wn(s):0,dn=s?Math.max(0,diff(T,s.start))%7+1:0,r=s?wr(s,n):['',''];
let h=`<div class="row2 top"><div><b>${T} (${dw(T)})</b>${s?`<div class="mu">${n}주차 ${dn}일(${f2(r[0])}-${f2(r[1])})</div>`:''}</div><div><button class="g sb" data-a="bk">백업</button> <button class="g sb" data-a="xl">엑셀</button></div></div>`;
const q=S.quotes.length?S.quotes[Math.floor(D(T)/864e5)%S.quotes.length].t:'';
h+=`<div class="card sm q">${q?'“'+esc(q)+'”':'응원 문구를 추가해 주세요'}</div>`;
const cc=`<div class="card">${sel(s)}${calhtml(false)}</div>`;
if(!s)return h+`<div class="card"><h2>목표를 먼저 설정해 주세요</h2><p class="mu">시작일, 목표일, 목표 체중, 하루 칼로리를 입력하면 주차와 달성률이 계산됩니다.</p><button data-a="go" data-v="goal">목표 설정하기</button></div>`+cc;
const t=st(s),el=diff(T,s.start)+1,rem=diff(s.goalDate,T),totd=Math.max(1,diff(s.goalDate,s.start)+1),mw=S.meas.some(m=>m.date>=mon(T)&&m.date<=addd(mon(T),6));
let w='<div class="ws"><div class="wc lb"><b>&nbsp;</b><span>목표</span><span>체중</span><span>운동</span></div>';
for(let i=1;i<=nwk(s)&&i<=30;i++){const a=wkAch(s,i),fut=wr(s,i)[0]>T;w+=`<div class="wc ${i===n?'cur':''}"><b>${i}주</b><span>${tw(s,i)}</span><span class="${a==null?'':a>=100?'o':a>=50?'h':'x'}">${a==null?'-':Math.round(a)+'%'}</span><span>${fut?'-':sc(s,i)+'점'}</span></div>`}
w+='</div>';
return h+`<div class="card sm"><div class="row2"><b>${esc(s.name)}</b><span class="mu">D+${el} · ${rem>=0?'D-'+rem:'D+'+(-rem)}${s.ik||s.xk?` · 섭취${s.ik||'-'}·운동${s.xk||'-'}kcal`:''} · 측정${mw?'✅':'⏳'}</span></div>${bar(el/totd*100,'thin')}<div class="row2" style="margin-top:8px"><span class="mu">총 달성률 · ${s.startW}→${t.cur}→${s.goalW}kg</span><b>${Math.round(t.pct)}%</b></div>${bar(t.pct,'thin')}${w}</div>`+cc}
function df(){const d=S.days[cd]||{};
return`<div class="dfm"><div class="r3"><div><label>날짜 (${dw(cd)})</label><input type="date" value="${cd}" data-c="1"></div><div><label>물 (×500ml)</label><input type="number" inputmode="decimal" step="0.5" data-f="water" value="${esc(d.water)}"></div><div><label>수면 (시간)</label><input type="number" inputmode="decimal" step="0.5" data-f="sleep" value="${esc(d.sleep)}"></div></div>
${['아침','점심','저녁','간식'].map((t,i)=>{const v=mk(d,i);return`<div class="ml"><span>${t}</span><button class="mk ${MC[v]}" data-a="mk" data-k="${i}">${MS[v]}</button><input data-f="m${i}" value="${esc(d['m'+i])}" placeholder="비우면 ✕ (안 먹음)"></div>`}).join('')}
<div class="rw"><span>컨디션</span>${['😫','😕','😐','🙂','😄'].map((e,i)=>`<button class="chip s ${d.cond==i+1?'on':''}" data-a="cond" data-v="${i+1}">${e}</button>`).join('')}<button class="chip s al ${d.alc?'on':''}" data-a="tog" data-f="alc">🍺 음주</button></div>
<div class="rw"><span>운동</span><button class="chip s ${car(d)?'on':''}" data-a="tog" data-f="car">러닝머신</button><button class="chip s ${ana(d)?'on':''}" data-a="tog" data-f="an">무산소</button></div>
${car(d)?`<div class="r3"><div><label>거리 (km)</label><input type="number" step="0.1" inputmode="decimal" data-f="km" value="${esc(d.km)}"></div><div><label>시간 (분)</label><input type="number" inputmode="numeric" data-f="run" value="${esc(d.run)}"></div><div><label>강도</label><select data-f="lv"><option value="">-</option>${['가볍게','보통','힘들게'].map(x=>`<option ${d.lv===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`:''}
${ana(d)?`<div class="rw"><span>루틴</span>${S.routines.map(r=>`<button class="chip s ${(d.rt||[]).includes(r)?'on':''}" data-a="rt" data-v="${esc(r)}">${esc(r)}</button>`).join('')}<button class="d" data-a="go" data-v="ex">수정</button></div>`:''}
<label>한 줄 일기</label><textarea rows="2" data-f="memo">${esc(d.memo)}</textarea></div>`}
function daily(){return`<h1>📝 데일리</h1><div class="card">${df()}</div>`}
function ex(){const s=act();let h=`<h1>🏃 운동</h1><div class="card">${sel(s)}${calhtml(true)}</div>`;
if(s){const c=Math.min(nw(s),wn(s));let tot=0;h+='<div class="card"><h2>주차별 점수 (5회 달성 시 100점)</h2>';for(let n=1;n<=c;n++){const p=sc(s,n);tot+=p;h+=`<div class="li"><span class="mu" style="min-width:48px">${n}주차</span><span style="flex:1">${bar(p)}</span><b>${p}점</b></div>`}h+=`<p class="mu">평균 ${Math.round(tot/c)}점</p></div>`}
return h+`<div class="card"><h2>무산소 루틴 관리</h2>${S.routines.map((r,i)=>`<div class="row" style="margin-bottom:6px"><input data-rn="${i}" value="${esc(r)}"><button class="g" data-a="rr" data-i="${i}" style="flex:0 0 auto">수정</button><button class="d" data-a="rd" data-i="${i}" style="flex:0 0 auto">삭제</button></div>`).join('')}<div class="row"><input id="nr" placeholder="새 루틴 (예: 어깨)"><button data-a="ra" style="flex:0 0 auto">추가</button></div></div>`}
function chart(){let p=S.meas.filter(m=>m.w!=null&&(!CS||m.date>=CS)&&(!CE||m.date<=CE));if(p.length<2)return'<p class="mu">선택한 기간에 체중 기록이 2회 이상 있어야 그래프가 표시됩니다.</p>';
const v=p.map(m=>m.w),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
const pts=p.map((m,i)=>`${10+i*(280/(p.length-1))},${100-(m.w-mn)/r*80}`).join(' ');
return`<svg viewBox="0 0 300 120" style="width:100%"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5"/><text x="10" y="116" font-size="10" fill="var(--mu)">${p[0].date.slice(5)}</text><text x="290" y="116" font-size="10" text-anchor="end" fill="var(--mu)">${p[p.length-1].date.slice(5)}</text></svg><p class="mu">최고 ${mx}kg · 최저 ${mn}kg · 기간 변화 ${fmt(v[v.length-1]-v[0])}kg</p>`}
function meas(){const L=[...S.meas].reverse();const cell=(c,p)=>c==null?'-':c+(p!=null?` (${fmt(c-p)})`:'');
let h=`<h1>📏 주간 측정</h1><div class="card"><label>날짜</label><input type="date" id="md" value="${today()}"><label>체중 (kg)</label><input type="number" step="0.1" inputmode="decimal" id="mw"><div class="r3">${M.slice(0,3).map(([k,t])=>`<div><label>${t} (cm)</label><input type="number" step="0.1" inputmode="decimal" id="m_${k}"></div>`).join('')}</div><div class="r3">${M.slice(3).map(([k,t])=>`<div><label>${t} (cm)</label><input type="number" step="0.1" inputmode="decimal" id="m_${k}"></div>`).join('')}</div><button style="margin-top:12px" data-a="sm">저장하기</button></div>
<div class="card"><h2>체중 추이</h2><div class="r2"><div><label>시작</label><input type="date" data-s="cs" value="${CS}"></div><div><label>종료</label><input type="date" data-s="ce" value="${CE}"></div></div>${chart()}</div>`;
if(L.length){h+=`<div class="card ov"><h2>기록 (괄호는 직전 대비)</h2><table><tr><th>날짜</th><th>체중</th>${M.map(m=>`<th>${m[1]}</th>`).join('')}<th></th></tr>`;
L.forEach((m,i)=>{const p=L[i+1]||{};h+=`<tr><td>${m.date.slice(5)}</td><td>${cell(m.w,p.w)}</td>${M.map(([k])=>`<td>${cell(m[k],p[k])}</td>`).join('')}<td><button class="d" data-a="dm" data-d="${m.date}">✕</button></td></tr>`});h+='</table></div>'}
return h}
function more(){return`<h1>더보기</h1><div class="card">${[['goal','🎯 목표 설정'],['lib','🔗 운동·관리 라이브러리'],['hist','📚 과거 이력'],['quote','💬 응원 문구'],['bak','💾 백업·복원']].map(([k,t])=>`<div class="li"><span>${t}</span><button class="g" data-a="go" data-v="${k}">열기</button></div>`).join('')}</div>`}
function goal(){const s=act(),v=s||{name:'새 도전',start:today(),goalDate:addd(today(),84),startW:'',goalW:'',wk:5,ik:'',xk:''};
let h=`<h1>🎯 목표</h1><div class="card"><label>시즌 이름</label><input id="gn" value="${esc(v.name)}"><div class="r2"><div><label>시작일</label><input type="date" id="gs" value="${v.start}"></div><div><label>목표일</label><input type="date" id="ge" value="${v.goalDate}"></div></div><div class="r2"><div><label>시작 체중 (kg)</label><input type="number" step="0.1" id="gw" value="${v.startW}"></div><div><label>목표 체중 (kg)</label><input type="number" step="0.1" id="gt" value="${v.goalW}"></div></div><div class="r3"><div><label>하루 섭취 (kcal)</label><input type="number" id="gi" value="${v.ik||''}"></div><div><label>하루 운동 (kcal)</label><input type="number" id="gx" value="${v.xk||''}"></div><div><label>주간 운동 (회)</label><input type="number" id="gk" value="${v.wk||5}"></div></div><button style="margin-top:12px" data-a="sg">${s?'수정 저장':'시즌 시작'}</button><p class="mu" id="gm"></p></div>`;
if(s)h+=`<div class="card"><h2>시즌 종료</h2><p class="mu">중단하거나 마무리할 때 종료하면 과거 이력에 보관됩니다.</p><label>한 줄 회고</label><textarea id="gr" rows="3" placeholder="멈춘 계기, 다음에 바꿀 점"></textarea><button class="g" style="margin-top:10px" data-a="end">시즌 종료하고 보관</button></div>`+wtcard(s);return h}
function wtcard(s){let b='';for(let i=1;i<=Math.min(nwk(s),30);i++)b+=`<div><label>${i}주차 (kg)</label><input type="number" step="0.1" inputmode="decimal" data-wt="${i}" placeholder="${(s.startW+(s.goalW-s.startW)*i/nwk(s)).toFixed(1)}" value="${s.wt&&s.wt[i]!=null?s.wt[i]:''}"></div>`;return`<div class="card"><h2>주차별 목표 체중</h2><p class="mu">비워 두면 시작~목표 체중을 균등하게 나눈 값(칸 안의 연한 숫자)이 목표가 됩니다.</p><div class="r3">${b}</div><button style="margin-top:10px" data-a="swt">주차 목표 저장</button></div>`}
function lib(){const cs=[...new Set(S.links.map(x=>x.c))],L=S.links.filter(x=>lf==='전체'||(lf==='⭐'?x.f:x.c===lf));
let h=`<h1>🔗 라이브러리</h1><div>${['전체','⭐',...cs].map(c=>`<button class="chip ${lf===c?'on':''}" data-a="lf" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="card">`;
h+=L.length?L.map(x=>`<div class="li"><div><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a><div class="mu">${esc(x.c)}${x.m?' · '+esc(x.m):''}</div></div><div><button class="d" data-a="fav" data-i="${x.id}">${x.f?'⭐':'☆'}</button><button class="d" data-a="dl" data-i="${x.id}">✕</button></div></div>`).join(''):'<p class="mu">저장된 링크가 없습니다. 아래에서 추가해 주세요.</p>';
h+=`</div><div class="card"><h2>링크 추가</h2><div class="r2"><div><label>분류</label><input id="lc" list="lcs" placeholder="밴드운동 등"></div><div><label>제목</label><input id="lt"></div></div><datalist id="lcs">${['밴드운동','자기 전 스트레칭','팔 루틴','피부관리',...cs].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="r2"><div><label>주소 (URL)</label><input id="lu" inputmode="url"></div><div><label>메모</label><input id="lm"></div></div><button style="margin-top:10px" data-a="addl">추가하기</button></div>`;
if(cs.length)h+=`<div class="card"><h2>분류 수정</h2>${cs.map((c,i)=>`<div class="row" style="margin-bottom:6px"><input data-cat="${i}" value="${esc(c)}"><button class="g" data-a="rc" data-i="${i}" style="flex:0 0 auto">변경</button></div>`).join('')}</div>`;return h}
function hist(){const L=S.seasons.filter(x=>x.end).sort((a,b)=>a.start<b.start?1:-1);
let h='<h1>📚 과거 이력</h1>';if(!L.length)h+='<div class="card"><p class="mu">종료된 시즌이 아직 없습니다. 재도전할 때는 현재 시즌을 종료한 뒤 목표 탭에서 새 시즌을 시작해 주세요.</p></div>';
L.forEach(s=>{const t=st(s);h+=`<div class="card"><h2>${esc(s.name)}</h2><p class="mu">${s.start} ~ ${s.end} (${diff(s.end,s.start)+1}일)</p><p>체중 ${s.startW}kg → ${s.endW}kg (목표 ${s.goalW}kg) · 달성률 ${Math.round(t.pct)}%</p>${bar(t.pct)}<p class="mu">운동 총 ${t.n}회 (주 평균 ${(t.n/t.wks).toFixed(1)}회) · 기록한 날 ${t.dys}일</p>${s.retro?`<p>회고: ${esc(s.retro)}</p>`:''}</div>`});
if(!act())h+='<button data-a="go" data-v="goal">새 시즌 시작하기</button>';return h}
function grp(f){return[3,2,1].map(n=>{const L=S.quotes.map((q,i)=>[q,i]).filter(([q])=>q.s==n);return L.length?`<div class="card"><h2>${'★'.repeat(n)}</h2>${L.map(f).join('')}</div>`:''}).join('')}
function quote(){return`<h1>💬 응원 문구</h1>${grp(([q,i])=>`<div class="li"><span>${esc(q.t)}</span><span style="white-space:nowrap"><button class="d" data-a="qs" data-i="${i}">별 변경</button><button class="d" data-a="dq" data-i="${i}">✕</button></span></div>`)}<div class="card"><div class="r2" style="grid-template-columns:3fr 1fr"><div><label>새 문구</label><input id="nq"></div><div><label>중요도</label><select id="ns"><option value="3">★★★</option><option value="2" selected>★★</option><option value="1">★</option></select></div></div><button style="margin-top:10px" data-a="addq">추가하기</button></div>`}
function bak(){return`<h1>💾 백업·복원</h1><div class="card"><p class="mu">기록은 이 기기의 브라우저에 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 아래 내용을 복사해 메모 앱 등에 보관해 주세요.</p><textarea id="bk" rows="8">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:10px"><button class="g" data-a="cp">복사</button><button data-a="imp">이 내용으로 복원</button></div><p class="mu" id="bm"></p></div>`}
const NAV=[['home','홈','🏠'],['daily','데일리','📝'],['ex','운동','🏃'],['meas','측정','📏'],['more','더보기','☰']],PAR={goal:1,lib:1,hist:1,quote:1,bak:1};
function render(){const m={home,daily,ex,meas,more,goal,lib,hist,quote,bak};
$('#app').innerHTML=`<div class="wrap">${PAR[V]?'<button class="g" style="margin-bottom:8px" data-a="go" data-v="more">← 더보기</button>':''}${m[V]()}</div>`;
$('#nav').innerHTML=NAV.map(([k,t,i])=>`<button class="${(PAR[V]?'more':V)===k?'on':''}" data-a="go" data-v="${k}">${i}<br>${t}</button>`).join('');
const md=$('#modal');if(MO){md.style.display='block';md.innerHTML=`<div class="mc"><button class="g" data-a="mx" style="float:right">닫기</button><h2>${cd} (${dw(cd)})</h2><div style="clear:both"></div>${df()}</div>`}else{md.style.display='none';md.innerHTML=''}}
function updMk(i){document.querySelectorAll(`[data-k="${i}"]`).forEach(b=>{const v=mk(dy(),i);b.textContent=MS[v];b.className='mk '+MC[v]})}
async function getDl(){try{if(window.claude){const d=await claude.use('downloads');if(d)return d}}catch(e){}
return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}}
const g=i=>{const v=$('#'+i).value;return v===''?null:+v};
function msg(t){let m=$('#toast');if(!m){m=document.createElement('div');m.id='toast';m.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px';document.body.appendChild(m)}m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',2500)}
const A={
go:d=>{V=d.v;MO=null;render();scrollTo(0,0)},
day:d=>{cd=d.d;MO='day';render()},mx:()=>{MO=null;render()},
bk:async()=>{try{const dl=await getDl();if(!dl){try{await navigator.clipboard.writeText(JSON.stringify(S));msg('백업 내용을 복사했습니다. 메모 앱에 붙여넣어 보관해 주세요.')}catch(e){A.go({v:'bak'})}return}await dl.save({filename:`diet-diary-backup-${today()}.json`,data:JSON.stringify(S)})}catch(e){if(e&&e.code==='declined')return;A.go({v:'bak'})}},
xl:async()=>{try{const dl=await getDl();if(!dl||!window.XLSX){msg('이 화면에서는 엑셀 다운로드를 사용할 수 없습니다.');return}
const wb=XLSX.utils.book_new(),s=act()||S.seasons[S.seasons.length-1],add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{}]),n);
add('데일리',Object.keys(S.days).sort().map(k=>{const d=S.days[k],m=dmark(d);return{날짜:k,요일:dw(k),아침:d.m0||'',점심:d.m1||'',저녁:d.m2||'',간식:d.m3||'',식단:m?MS[m]:'',물ml:d.water?d.water*500:'',수면h:d.sleep||'',컨디션:d.cond||'',음주:d.alc?'O':'',러닝km:d.km||'',러닝분:d.run||'',강도:d.lv||'',무산소:(d.rt||[]).join('/'),운동횟수:sess(d),일기:d.memo||''}}));
add('측정',S.meas.map(m=>{const r={날짜:m.date,체중:m.w};M.forEach(([k,t])=>r[t]=m[k]);return r}));
const wk=[];if(s)for(let i=1;i<=nwk(s);i++){const a=wkAch(s,i);wk.push({주차:i,시작:wr(s,i)[0],종료:wr(s,i)[1],목표체중:tw(s,i),체중달성률:a==null?'':Math.round(a),운동횟수:wkCount(wr(s,i)[0]),운동점수:sc(s,i)})}
add('주차별',wk);
add('시즌',S.seasons.map(x=>({이름:x.name,시작:x.start,목표일:x.goalDate,시작체중:x.startW,목표체중:x.goalW,섭취kcal:x.ik||'',운동kcal:x.xk||'',종료:x.end||'',회고:x.retro||''})));
await dl.save({filename:`diet-diary-${today()}.xlsx`,data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}catch(e){if(e&&e.code==='declined')return;msg('다운로드하지 못했습니다.')}},
swt:()=>{const s=act();if(!s)return;const o={};document.querySelectorAll('[data-wt]').forEach(i=>{if(i.value!=='')o[i.dataset.wt]=+i.value});s.wt=o;save();msg('주차별 목표를 저장했습니다.')},
tog:d=>{const y=dy(),f=d.f;if(f==='car'){if(car(y)){y.car=false;y.run='';y.km='';y.lv=''}else y.car=true}else if(f==='an'){if(ana(y)){y.an=false;y.rt=[]}else y.an=true}else y[f]=!y[f];save();render()},
rt:d=>{const y=dy();y.rt=y.rt||[];const i=y.rt.indexOf(d.v);i<0?y.rt.push(d.v):y.rt.splice(i,1);y.an=true;save();render()},
mk:d=>{const y=dy(),i=d.k;if(!(y['m'+i]||'').trim())return;y['r'+i]={o:'△','△':'x',x:'o'}[y['r'+i]||'o'];save();updMk(i)},
cond:d=>{const y=dy();y.cond=y.cond==d.v?0:+d.v;save();render()},
ra:()=>{const v=$('#nr').value.trim();if(v&&!S.routines.includes(v)){S.routines.push(v);save();render()}},
rr:d=>{const n=$(`[data-rn="${d.i}"]`).value.trim(),o=S.routines[d.i];if(!n||n===o)return;S.routines[d.i]=n;for(const k in S.days){const r=S.days[k].rt;if(r){const j=r.indexOf(o);if(j>=0)r[j]=n}}save();render()},
rd:d=>{S.routines.splice(+d.i,1);save();render()},
sm:()=>{const date=$('#md').value||today(),r={date,w:g('mw')};M.forEach(([k])=>r[k]=g('m_'+k));if(r.w==null&&M.every(([k])=>r[k]==null))return;S.meas=S.meas.filter(m=>m.date!==date).concat(r).sort((a,b)=>a.date<b.date?-1:1);save();render()},
dm:d=>{S.meas=S.meas.filter(m=>m.date!==d.d);save();render()},
sg:()=>{const s=act()||{id:Date.now()};const n={name:$('#gn').value||'다이어트',start:$('#gs').value,goalDate:$('#ge').value,startW:+$('#gw').value,goalW:+$('#gt').value,wk:+$('#gk').value||5,ik:+$('#gi').value||0,xk:+$('#gx').value||0};
if(!n.start||!n.goalDate||!n.startW||!n.goalW){$('#gm').textContent='날짜와 체중을 모두 입력해 주세요.';return}
Object.assign(s,n);if(!S.seasons.includes(s))S.seasons.push(s);save();A.go({v:'home'})},
end:()=>{const s=act();if(!s)return;s.end=today();s.retro=$('#gr').value;s.endW=st(s).cur;save();A.go({v:'hist'})},
lf:d=>{lf=d.v;render()},
addl:()=>{let u=$('#lu').value.trim();const t=$('#lt').value.trim();if(!u||!t)return;if(!/^https?:\/\//.test(u))u='https://'+u;S.links.push({id:Date.now(),c:$('#lc').value.trim()||'기타',t,u,m:$('#lm').value.trim(),f:false});save();render()},
dl:d=>{S.links=S.links.filter(x=>x.id!=d.i);save();render()},
fav:d=>{const x=S.links.find(x=>x.id==d.i);if(x)x.f=!x.f;save();render()},
rc:d=>{const cs=[...new Set(S.links.map(x=>x.c))],o=cs[d.i],n=$(`[data-cat="${d.i}"]`).value.trim();if(!n||n===o)return;S.links.forEach(x=>{if(x.c===o)x.c=n});if(lf===o)lf=n;save();render()},
addq:()=>{const q=$('#nq').value.trim();if(q){S.quotes.push({t:q,s:+$('#ns').value});save();render()}},
qs:d=>{const q=S.quotes[+d.i];q.s=q.s%3+1;save();render()},
dq:d=>{S.quotes.splice(+d.i,1);save();render()},
cp:()=>{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value);$('#bm').textContent='복사했습니다.'}catch(e){$('#bm').textContent='선택된 내용을 직접 복사해 주세요.'}},
imp:()=>{try{S=Object.assign({seasons:[],days:{},meas:[],links:[],quotes:[]},JSON.parse($('#bk').value));mig();save();$('#bm').textContent='복원했습니다.'}catch(e){$('#bm').textContent='형식이 올바르지 않습니다.'}}
};
document.addEventListener('click',e=>{if(e.target.id==='modal'){MO=null;render();return}const t=e.target.closest('[data-a]');if(t)A[t.dataset.a](t.dataset)});
